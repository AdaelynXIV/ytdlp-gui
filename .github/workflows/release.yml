name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller yt-dlp curl-cffi imageio-ffmpeg requests packaging

      - name: Build application
        run: pyinstaller --noconfirm YTDLP-GUI.spec

      - name: Build updater
        run: pyinstaller --noconfirm updater.spec

      - name: Prepare release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\YTDLP-GUI.exe release\YTDLP-GUI.exe
          Copy-Item dist\YTDLP-Updater.exe release\YTDLP-Updater.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
